repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: node-syntax
        name: Node.js syntax check
        entry: bash -c 'for f in server/config.js server/index.js server/lib/*.js server/services/*.js server/routes/*.js; do node -c "$f" || exit 1; done'
        language: system
        pass_filenames: false
