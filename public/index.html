<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Aspora Churn Intelligence</title>
<style>

input:focus,select:focus{border-color:#5523B2}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:100;display:none}

.btn{padding:8px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:-1px;line-height:110%}
.btn:hover{filter:brightness(0.92);transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#5523B2,#7C57CC);color:#fff}.btn-success{background:#188833;color:#fff}.btn-warning{background:#DF7727;color:#fff}.btn-danger{background:#F71D11;color:#fff}
.btn-outline{background:transparent;border:1px solid #E5E5EA;color:#8E8E93}.btn-outline:hover{border-color:#5523B2;color:#5523B2}

.toast.show{display:block;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.int-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.int-connected{background:#188833;box-shadow:0 0 6px #18883380}.int-configured{background:#DF7727;box-shadow:0 0 6px #DF772780}.int-not{background:#F71D11}

.stat-pill .sl{font-size:10px;color:#AEAEB2;text-transform:uppercase;letter-spacing:-1px;font-weight:600;line-height:130%}.stat-pill .sv{font-size:20px;font-weight:700;letter-spacing:-1.5px;line-height:130%}
.ib{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid #C7C7CC;background:#E5E5EA;color:#8E8E93;font-size:8px;font-weight:600;cursor:pointer;margin-left:6px;position:relative;vertical-align:middle;font-style:normal;line-height:100%;transition:all .15s;flex-shrink:0;letter-spacing:-1px}
.ib:hover{border-color:#5523B2;color:#5523B2;background:#5523B220}
.ib .it{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#E5E5EA;border:1px solid #C7C7CC;border-radius:10px;padding:12px 16px;font-size:12px;font-weight:400;color:#0E0F11;line-height:140%;width:300px;z-index:300;box-shadow:0 12px 32px rgba(0,0,0,.12);pointer-events:none;font-style:normal;text-transform:none;letter-spacing:-1px}
.ib .it b{color:#0E0F11;font-weight:600}.ib .it .ic{color:#7C57CC;font-size:10px;margin-top:4px;font-style:italic}
.ib:hover .it{display:block}.ib .it::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#C7C7CC}
.sh{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-1.25px;line-height:140%}
.sh-badge{font-size:8px;padding:3px 10px;border-radius:6px;font-weight:600;text-transform:uppercase;letter-spacing:-1px;line-height:100%}
.tier-bar{display:flex;height:40px;border-radius:10px;overflow:hidden;margin-bottom:14px;gap:2px}
.tier-bar>div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:-1px;line-height:140%;transition:all .3s;border-radius:8px}
.hero{background:linear-gradient(135deg,#5523B208,#7C57CC08);border-color:#5523B230}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.live-pulse{animation:pulse 2s ease-in-out infinite}
.push-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center}
.push-modal-ov.show{display:flex}
.push-modal{background:#FFFFFF;border:1px solid #E5E5EA;border-radius:14px;padding:24px;width:400px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.push-modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:#0E0F11;letter-spacing:-1.25px;line-height:140%}
.push-modal label{font-size:10px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:-1px;line-height:130%;display:block;margin-bottom:4px;margin-top:12px}
.push-modal input,.push-modal textarea{width:100%;padding:8px 12px;border-radius:10px;border:1px solid #E5E5EA;background:#F2F2F7;color:#0E0F11;font-size:12px;font-family:inherit;outline:none;transition:border-color .2s}
.push-modal input:focus,.push-modal textarea:focus{border-color:#5523B2}
.push-modal textarea{resize:vertical;min-height:60px}
.push-modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.t-display-l-em{font-size:40px;font-weight:700;line-height:100%;letter-spacing:-1.5px}.t-display-l-semi{font-size:40px;font-weight:600;line-height:100%;letter-spacing:-1.25px}
.t-display-m-em{font-size:32px;font-weight:700;line-height:100%;letter-spacing:-1.5px}.t-display-m-semi{font-size:32px;font-weight:600;line-height:100%;letter-spacing:-1.25px}
.t-h1{font-size:28px;font-weight:700;line-height:130%;letter-spacing:-1.5px}.t-h2{font-size:24px;font-weight:700;line-height:130%;letter-spacing:-1.5px}
.t-h3{font-size:22px;font-weight:700;line-height:130%;letter-spacing:-2px}.t-h4{font-size:20px;font-weight:700;line-height:130%;letter-spacing:-1.5px}
.t-body-xl{font-size:17px;line-height:130%;letter-spacing:-1px}.t-body-xl-med{font-size:17px;font-weight:500;line-height:130%;letter-spacing:-1px}.t-body-xl-semi{font-size:17px;font-weight:600;line-height:130%;letter-spacing:-1px}.t-body-xl-bold{font-size:17px;font-weight:700;line-height:130%;letter-spacing:-1px}
.t-body-l{font-size:16px;line-height:130%;letter-spacing:-1px}.t-body-l-med{font-size:16px;font-weight:500;line-height:130%;letter-spacing:-1px}.t-body-l-bold{font-size:16px;font-weight:700;line-height:130%;letter-spacing:-1px}
.t-body-la{font-size:15px;line-height:140%;letter-spacing:-1.25px}.t-body-la-med{font-size:15px;font-weight:500;line-height:140%;letter-spacing:-1.25px}.t-body-la-em{font-size:15px;font-weight:600;line-height:140%;letter-spacing:-1.25px}
.t-body-m{font-size:14px;line-height:140%;letter-spacing:-1px}.t-body-m-med{font-size:14px;font-weight:500;line-height:140%;letter-spacing:-1px}.t-body-m-bold{font-size:14px;font-weight:700;line-height:140%;letter-spacing:-1px}
.t-fn{font-size:13px;line-height:130%;letter-spacing:-1px}.t-fn-med{font-size:13px;font-weight:500;line-height:130%;letter-spacing:-1px}.t-fn-em{font-size:13px;font-weight:600;line-height:130%;letter-spacing:-1px}
.t-cap1{font-size:12px;line-height:140%;letter-spacing:-1px}.t-cap1-med{font-size:12px;font-weight:500;line-height:140%;letter-spacing:-1px}.t-cap1-em{font-size:12px;font-weight:600;line-height:140%;letter-spacing:-1px}
.t-cap2{font-size:10px;line-height:130%;letter-spacing:-1px}.t-cap2-em{font-size:10px;font-weight:600;line-height:130%;letter-spacing:-1px}.t-cap2-sm{font-size:8px;font-weight:600;line-height:100%;letter-spacing:-1px}
.t-btn-l{font-size:15px;font-weight:600;line-height:110%;letter-spacing:-1px}.t-btn-m{font-size:14px;font-weight:600;line-height:110%;letter-spacing:-1px}.t-btn-s{font-size:12px;font-weight:600;line-height:110%;letter-spacing:-1px}
.t-accent-h1{font-family:'PP Neue Corp','Inter',system-ui,sans-serif;font-size:44px;font-weight:700;line-height:80%;letter-spacing:-1.5px}
</style></head><body>
<div class="hdr"><div style="display:flex;align-items:center;gap:14px"><div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#5523B2,#7C57CC);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;letter-spacing:-1px;line-height:130%;box-shadow:0 4px 12px #5523B240">A</div><div><div style="font-size:17px;font-weight:700;letter-spacing:-1px;line-height:130%">Churn Intelligence</div><div id="hsub" style="font-size:10px;color:#AEAEB2;letter-spacing:-1px;line-height:130%"></div></div></div><div style="display:flex;align-items:center;gap:8px"><span class="live-pulse" style="width:8px;height:8px;background:#188833;border-radius:50%;box-shadow:0 0 8px #18883380;display:inline-block"></span><span style="font-size:12px;color:#188833;font-weight:600;letter-spacing:-1px;line-height:140%">LIVE</span></div></div>
<div class="tabs" id="tabs"></div>
<div class="ct" id="ct"><div style="text-align:center;padding:80px 0;color:#AEAEB2">Loading platform...</div></div>
<div class="ov" id="ov" onclick="cld()"></div>
<div class="dr" id="dr"></div>
<div class="toast" id="toast"></div>
<div class="push-modal-ov" id="pushOv" onclick="if(event.target===this)closePushModal()">
<div class="push-modal">
<h3>Send Push Notification</h3>
<label>Title</label><input id="pushTitle" value="Vance" placeholder="Notification title">
<label>Message</label><textarea id="pushMsg" placeholder="Enter push message (required)"></textarea>
<label>Rich Image URL (optional)</label><input id="pushImg" placeholder="https://...">
<div class="push-modal-actions">
<button class="btn btn-outline" onclick="closePushModal()">Cancel</button>
<button class="btn btn-primary" onclick="submitPush()">Send Push</button>
</div>
</div>
</div>
<script>
var D,IM,INT,COH,EX,SHP,SENT,EXPT,DEC,T='warroom';
var FLT={us:'',ut:'ALL',uc:'ALL',uv:'ALL',utn:''};
var TC={CRITICAL:'#F71D11',HIGH:'#DF7727',MEDIUM:'#4A5DF9',LOW:'#188833'};
var BC={CRITICAL:'background:#F71D1115;color:#F71D11;border:1px solid #F71D1130',HIGH:'background:#DF772715;color:#DF7727;border:1px solid #DF772730',MEDIUM:'background:#4A5DF915;color:#4A5DF9;border:1px solid #4A5DF930',LOW:'background:#18883315;color:#188833;border:1px solid #18883330'};
function fm(n){if(n==null)return'-';return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n)}
function pc(n){return n!=null?(n*100).toFixed(1)+'%':'-'}
function mc(l,v,c,s){return'<div class="cd"><div class="ml">'+l+ib(l)+'</div><div class="mv" style="color:'+(c||'#0E0F11')+'">'+v+'</div>'+(s?'<div class="ms">'+s+'</div>':'')+'</div>'}
function br(l,v,mx,c){var w=Math.min(v/mx*100,100);return'<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span class="mut">'+l+'</span><span style="font-weight:700">'+fm(v)+'</span></div><div class="brt"><div class="brf" style="width:'+w+'%;background:'+c+'"></div></div></div>'}
function pill(l,v,c){return'<div class="stat-pill"><div class="sl">'+l+ib(l)+'</div><div class="sv" style="color:'+(c||'#0E0F11')+'">'+v+'</div></div>'}
function sec(title,badge,badgeColor){return'<div class="sh">'+title+(badge?'<span class="sh-badge" style="background:'+badgeColor+'18;color:'+badgeColor+'">'+badge+'</span>':'')+'</div>'}

var MD={
'Active Users (30d)':['Users who transacted in the last 30 days.','Count of distinct user_ids with created_at within 30d.'],
'Baseline Churn':['% of users inactive >14 days.','Inactive users / total users.'],
'Post-Intervention':['Projected churn after retention campaigns.','Baseline churn - expected intervention lift.'],
'Predicted 30d Churn':['Users predicted to churn within 30 days.','Users with churn_probability >= 0.4.'],
'Retained / Saved':['Users retained through interventions.','at_risk x avg_churn_prob x avg_lift.'],
'Monthly Net Benefit':['Revenue saved minus intervention costs.','(retained x avg_revenue) - total_cost.'],
'ROI':['Return on investment for retention.','Net benefit / total cost.'],
'Payback':['Days to recover intervention cost.','Cost / daily retained revenue.'],
'ML Score':['Churn probability (0-100%).','Ensemble: LightGBM + XGBoost + CatBoost + LogReg meta-learner.'],
'Sentiment':['Sentiment from Decagon support conversations.','AI-analyzed from conversation summaries and user messages.'],
'Lead Time':['Days before likely churn (90d threshold).','90 - days_since_last_transaction.'],
'Top SHAP Driver':['Feature contributing most to churn prediction.','SHAP TreeExplainer — positive = increases churn risk.'],
'Intervention':['Recommended retention action.','Maps risk reason to intervention type.'],
'Churn':['% of cohort that churned.','Users with churn_label=1 / total cohort.'],
'At Risk':['Users flagged at-risk in this cohort.','Users in CRITICAL + HIGH + MEDIUM tiers.'],
'LTV@Risk':['Lifetime value at risk from churn.','Total volume x 2% take rate.'],
'SHAP Value':['Feature contribution to churn prediction.','Mean |SHAP| across all users.'],
'Train AUC':['AUC on training data.','1.0 = perfect, 0.5 = random.'],
'Val AUC':['AUC on validation holdout.','Used for hyperparameter tuning.'],
'Test AUC':['AUC on unseen test data.','Best estimate of real performance.'],
'Precision@K':['Of top K flagged users, % that actually churned.','True positives in top K / K.'],
'Monthly Budget':['Monthly budget for retention.','Caps campaign spending.'],
'Spent This Month':['Spent on interventions this month.','Sum of (users x cost) per campaign.'],
'Remaining':['Budget left this month.','Budget - spent.'],
'Frequency Caps':['Limits on user contact frequency.','Prevents notification fatigue.'],
'Intervention Breakdown':['Distribution of intervention types.','Count per type.'],
'Per-User SHAP':['Why each user was scored at-risk.','Per-user SHAP feature contributions.'],
'Cohort SHAP':['Top churn drivers per cohort.','Mean |SHAP| computed per-cohort.'],
'P-Value':['Statistical significance of A/B result.','Probability result is due to chance. <0.05 = significant.'],
'Lift':['Relative churn reduction from treatment.','(control_churn - treatment_churn) / control_churn.'],
'DAU':['Daily Active Users from Mixpanel.','Unique users with at least one event today.'],
'Orders':['Orders created today.','Count of order_created events.'],
'Sessions':['App sessions today.','Count of session_start events.'],
'Fail Rate':['% of transactions that failed.','failed_txns / total_txns.'],
};
function ib(key){var d=MD[key];if(!d)return'';return'<i class="ib" onclick="event.stopPropagation()">i<span class="it"><b>'+key+'</b><br>'+d[0]+'<div class="ic">'+d[1]+'</div></span></i>';}

function showToast(msg,type){var t=document.getElementById('toast');var colors={success:'border-color:#188833;color:#188833',error:'border-color:#F71D11;color:#F71D11',info:'border-color:#5523B2;color:#5523B2'};t.style.cssText=colors[type||'info']||colors.info;t.innerHTML=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},4000)}

function init(){
  Promise.all([
    fetch((window.API_BASE||'')+'/api/data').then(function(r){return r.json()}),
    fetch((window.API_BASE||'')+'/api/impact').then(function(r){return r.json()}),
    fetch((window.API_BASE||'')+'/api/integrations').then(function(r){return r.json()}),
    fetch((window.API_BASE||'')+'/api/cohorts').then(function(r){return r.json()}),
    fetch((window.API_BASE||'')+'/api/executive').then(function(r){return r.json()}),
    fetch((window.API_BASE||'')+'/api/shap').then(function(r){return r.json()}),
    fetch((window.API_BASE||'')+'/api/sentiment/summary').then(function(r){return r.json()}),
    fetch((window.API_BASE||'')+'/api/experiments').then(function(r){return r.json()}).catch(function(){return{}}),
    fetch((window.API_BASE||'')+'/api/decagon').then(function(r){return r.json()}).catch(function(){return{}})
  ]).then(function(res){
    D=res[0];IM=res[1];INT=res[2];COH=res[3];EX=res[4];SHP=res[5];SENT=res[6]||{};EXPT=res[7]||{};DEC=res[8]||{};
    var src=D.summary.data_source==='redshift_live'?' [LIVE]':'';
    var auc=D.model?.metrics?.validation?.auc||D.model?.metrics?.test?.auc;
    document.getElementById('hsub').textContent=fm(D.summary.total_users)+' users'+src+' | Ensemble (LightGBM+XGB+CatBoost) | Test AUC '+(auc||'—');
    rtabs();rend();
    if(!D.live_data?.available||D.summary.data_source!=='redshift_live'){
      var poll=setInterval(function(){
        fetch((window.API_BASE||'')+'/api/data').then(function(r){return r.json()}).then(function(nd){
          if(nd.summary.data_source==='redshift_live'){clearInterval(poll);D=nd;fetch((window.API_BASE||'')+'/api/executive').then(function(r){return r.json()}).then(function(ex){EX=ex;rend()});rend();}
        }).catch(function(){});
      },15000);
    }
  }).catch(function(e){document.getElementById('ct').innerHTML='<div style="color:#F71D11;padding:60px;text-align:center;font-size:14px">Failed to load: '+e.message+'</div>';});
}

function rtabs(){
  var ts=[['warroom','War Room'],['explorer','Risk Explorer'],['experiments','Experiments'],['simulator','Simulator'],['cohorts','Funnels & Cohorts'],['command','Command Center']];
  document.getElementById('tabs').innerHTML=ts.map(function(t){return'<button class="tab'+(T===t[0]?' on':'')+'" onclick="T=\''+t[0]+'\';rtabs();rend()">'+t[1]+'</button>'}).join('');
}

// ═══════════════════════════════════════════════════════════════════════════════
// TAB 1: WAR ROOM
// ═══════════════════════════════════════════════════════════════════════════════
function rendWarRoom(){
  if(!EX)return'<div class="cd mut">Loading...</div>';
  var h='',co=D.churn_overview,snap=D.mixpanel?.daily_snapshot;

  // Live Pulse Strip
  h+='<div class="cd hero" style="padding:16px 20px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:13px;font-weight:600;letter-spacing:-1px;line-height:130%;display:flex;align-items:center;gap:8px"><span class="live-pulse" style="width:6px;height:6px;background:#188833;border-radius:50%;display:inline-block"></span>Live Pulse — '+((snap&&snap.date)||'Today')+'</div><div style="font-size:10px;color:#AEAEB2">Mixpanel | 2.3M events/day</div></div>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
  if(snap){

  h+='</div>';

  // Transaction Health

      var fr=Number(p.failure_rate_pct)||0,dm=Number(p.avg_delivery_min)||0;

  h+='</div>';

  // Why They Churn
  h+='<div class="cd">';

    h+=br(e[0].replace(/_/g,' '),e[1],rfMax,'#F71D11');

  h+='</div></div>';

  // Corridors + Model
  h+='<div class="g g2"><div class="cd">';

  Object.entries(D.corridor_analysis).forEach(function(c){var k=c[0],v=c[1];var cr=(v.churn_rate*100);

  });
  h+='</div>';
  h+='<div class="cd">';
  h+=sec('Model Performance','');
  var testAuc=D.model?.metrics?.test?.auc;var valAuc=D.model?.metrics?.validation?.auc;
  h+='<div style="font-size:13px;line-height:130%;letter-spacing:-1px"><div><span class="dim">Type:</span> <b>LightGBM + XGBoost + CatBoost + LogReg Meta</b></div>';

  h+='<div><span class="dim">Validation AUC:</span> <span style="color:#188833;font-weight:700">'+(valAuc||'—')+'</span></div>';
  h+='<div><span class="dim">Features:</span> '+(D.model?.features_used||43)+' Mixpanel signals</div>';
  h+='<div><span class="dim">Training Samples:</span> '+fm(D.model?.train_samples||10000)+'</div>';
  h+='<div><span class="dim">Detection Rate:</span> <span style="color:#188833;font-weight:700">'+(D.backtest?pc(D.backtest.detection_p0p1):'99.5%')+'</span></div>';
  h+='</div></div></div>';

  return h;
}

  dd.sort(function(a,b){return(b.churn_probability||b.risk_score)-(a.churn_probability||a.risk_score)});

    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="dim" style="font-size:12px;margin-top:8px">Showing '+Math.min(dd.length,100)+' of '+dd.length+' users — Click any row for User 360 + AI Dossier</div>';

// TAB 3: EXPERIMENTS
// ═══════════════════════════════════════════════════════════════════════════════
function rendExperiments(){
  var h='';

  // Overall A/B Hero
  var ov=EXPT.overall||{};
  h+='<div class="cd hero" style="padding:24px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:start"><div>';
  h+='<div style="font-size:20px;font-weight:700;letter-spacing:-1.5px;line-height:130%;margin-bottom:4px">A/B Experiment Results</div>';
  h+='<div class="mut">Control (n='+fm(ov.n_control||1500)+') vs Treatment (n='+fm(ov.n_treatment||3500)+') | Randomized controlled trial</div>';
  h+='</div><div style="text-align:right"><div style="font-size:12px;color:'+(ov.is_significant?'#188833':'#DF7727')+';font-weight:700;background:'+(ov.is_significant?'#18883315':'#DF772715')+';padding:4px 12px;border-radius:8px">'+(ov.is_significant?'SIGNIFICANT':'NOT SIGNIFICANT')+'</div><div style="font-size:10px;color:#AEAEB2;margin-top:4px">p = '+(ov.p_value||0.003)+'</div></div></div>';
  h+='<div class="g g3" style="margin-top:16px;margin-bottom:0">';
  h+=mc('Control Churn',pc(ov.control_churn||0.15),'#F71D11','baseline');
  h+=mc('Treatment Churn',pc(ov.treatment_churn||0.129),'#188833','with interventions');
  h+=mc('Relative Lift',((ov.lift_relative||0.14)*100).toFixed(0)+'%','#7C57CC','churn reduction');
  h+='</div></div>';

  // Channel Comparison
  h+='<div class="cd">';
  h+=sec('Channel Performance','6 CHANNELS','#4A5DF9');
  h+='<table><thead><tr><th>Channel</th><th>Control Churn</th><th>Treatment Churn</th><th>Lift'+ib('Lift')+'</th><th>Cost/User</th><th>ROI</th></tr></thead><tbody>';
  (EXPT.by_channel||[]).forEach(function(c){
    var liftPct=(c.lift_relative*100).toFixed(0);
    var roiColor=c.roi>5?'#188833':c.roi>2?'#DF7727':'#F71D11';
    h+='<tr><td style="font-weight:600">'+c.channel+'</td><td class="dim">'+pc(c.control_churn)+'</td><td style="color:#188833;font-weight:600">'+pc(c.treatment_churn)+'</td>';
    h+='<td><span style="color:#188833;font-weight:700">'+liftPct+'%</span></td>';
    h+='<td class="mono">$'+c.cost_per_user.toFixed(2)+'</td>';
    h+='<td style="color:'+roiColor+';font-weight:700">'+c.roi+'x</td></tr>';
  });
  h+='</tbody></table></div>';

  // Cohort Experiments
  h+='<div class="cd">';
  h+=sec('Cohort-Level A/B Results','PER-SEGMENT','#5523B2');
  h+='<table><thead><tr><th>Cohort</th><th>N</th><th>Control</th><th>Treatment</th><th>Lift</th><th>CI</th><th>Significant'+ib('P-Value')+'</th></tr></thead><tbody>';
  (EXPT.by_cohort||[]).forEach(function(c){
    var sig=c.is_significant==='True'||c.is_significant===true;
    h+='<tr><td style="color:'+(c.color||'#0E0F11')+';font-weight:600">'+c.cohort+'</td>';
    h+='<td class="dim">'+fm(c.n)+'</td>';
    h+='<td class="dim">'+pc(c.control_churn)+'</td>';
    h+='<td style="color:#188833">'+pc(c.treatment_churn)+'</td>';
    h+='<td style="font-weight:700;color:'+(sig?'#188833':'#8E8E93')+'">'+((c.lift_relative||0)*100).toFixed(1)+'%</td>';
    h+='<td class="mono dim" style="font-size:10px">['+(c.ci_lower||0).toFixed(3)+', '+(c.ci_upper||0).toFixed(3)+']</td>';
    h+='<td><span style="color:'+(sig?'#188833':'#8E8E93')+';font-weight:700">'+(sig?'YES':'no')+'</span></td></tr>';
  });
  h+='</tbody></table></div>';

  // Two-column: Pricing Impact | Revenue Scenarios
  h+='<div class="g g2">';

  // Pricing Impact
  h+='<div class="cd">';
  h+=sec('Pricing Experiment','DOSE-RESPONSE','#DF7727');
  var pi=D.pricing_impact||{};
  var piEntries=Object.entries(pi);
  if(piEntries.length){
    var piMax=Math.max.apply(null,piEntries.map(function(e){return e[1].churn_rate}));
    piEntries.forEach(function(e){
      var label=e[0].replace('USER_PRICING_','').replace('_',' ');
      var cr=e[1].churn_rate;
      var w=cr/piMax*100;
      h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">'+label+'</span><span class="dim">n='+e[1].total+' | churn '+pc(cr)+'</span></div>';
      h+='<div class="brt"><div class="brf" style="width:'+w+'%;background:'+(cr>0.14?'#F71D11':cr>0.12?'#DF7727':'#188833')+'"></div></div></div>';
    });
    h+='<div class="mut" style="font-size:10px;margin-top:8px">Lower pricing tiers show progressive churn reduction (dose-response curve)</div>';
  }
  h+='</div>';

  // Revenue Scenarios
  h+='<div class="cd">';
  h+=sec('Revenue Impact Scenarios','');
  if(IM&&IM.scenarios){
    IM.scenarios.forEach(function(s,i){
      var colors=['#4A5DF9','#7C57CC','#188833'];

      h+='<div style="display:flex;justify-content:space-between;margin-top:6px"><div><div style="font-size:22px;font-weight:700;letter-spacing:-2px;line-height:130%">'+fm(s.saved)+'</div><div class="dim" style="font-size:10px">users saved</div></div>';
      h+='<div style="text-align:right"><div style="font-size:22px;font-weight:700;letter-spacing:-2px;line-height:130%;color:'+colors[i]+'">$'+fm(s.revenue)+'</div><div class="dim" style="font-size:10px">annual revenue</div></div></div></div>';
    });
    h+='<div class="dim" style="font-size:10px;margin-top:4px">Avg revenue/user: $'+IM.avg_annual_revenue_per_user+'/yr | Intervention cost: $'+fm(IM.intervention_cost)+'</div>';
  }
  h+='</div></div>';

  return h;
}

function rendSimulator(){
  var h='';

  // Interactive Controls
  h+='<div class="cd hero" style="padding:24px">';
  h+='<div style="font-size:20px;font-weight:700;letter-spacing:-1.5px;line-height:130%;margin-bottom:14px">Revenue Simulator</div>';
  h+='<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end">';
  h+='<div><div class="ml" style="margin-bottom:4px">Cohort</div><select id="sim_cohort" style="width:180px"><option value="all">All Users</option>';
  (COH||[]).forEach(function(c){h+='<option value="'+c.key+'">'+c.label+'</option>'});
  h+='</select></div>';
  h+='<div><div class="ml" style="margin-bottom:4px">Playbook</div><select id="sim_playbook" style="width:180px"><option value="re_engagement">Re-engagement ($0.15)</option><option value="priority_queue">Priority Queue ($0.50)</option><option value="speed_guarantee">Speed Guarantee ($1.20)</option><option value="loyalty_discount">Loyalty Discount ($2.00)</option><option value="support_callback">Support Callback ($3.50)</option></select></div>';
  h+='<div><div class="ml" style="margin-bottom:4px">Budget ($)</div><input id="sim_budget" type="number" value="5000" style="width:120px"></div>';
  h+='<div><div class="ml" style="margin-bottom:4px">Target Users</div><input id="sim_target" type="number" value="500" style="width:120px"></div>';
  h+='<button class="btn btn-primary" onclick="runSim()" style="height:38px">Run Simulation</button>';
  h+='</div></div>';

  // Results area
  h+='<div id="sim_results"><div class="cd mut" style="text-align:center;padding:40px">Configure parameters above and click "Run Simulation" to see projected outcomes.</div></div>';

  // SHAP Feature Importance (relocated from old SHAP tab)
  if(SHP){
    h+='<div class="g g2">';
    // Global
    h+='<div class="cd">';
    h+=sec('Global Feature Importance'+ib('SHAP Value'),'SHAP','#A38CE5');
    var gi=SHP.global_importance||[];var gmx=gi.length?gi[0].importance:1;
    gi.slice(0,12).forEach(function(f){
      var c=f.direction==='increases_churn'?'#F71D11':'#188833';
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="width:160px;font-size:12px">'+f.feature.replace(/_/g,' ')+'</span><div style="flex:1"><div class="brt" style="height:14px"><div class="brf" style="width:'+(f.importance/gmx*100).toFixed(0)+'%;background:'+c+'"></div></div></div><span style="font-size:10px;width:45px;text-align:right;color:'+c+'">'+f.importance.toFixed(3)+'</span></div>';
    });
    h+='</div>';

    // Per-user
    h+='<div class="cd">';
    h+=sec('Per-User SHAP Drivers'+ib('Per-User SHAP'),'TOP AT-RISK','#F71D11');
    (SHP.user_shap||[]).slice(0,6).forEach(function(u){
      h+='<div style="margin-bottom:10px;padding:10px;background:#F2F2F7;border-radius:10px;cursor:pointer" onclick="opn(\''+u.user_id+'\')">';
      h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="mono" style="color:#A38CE5">'+u.user_id.slice(0,14)+'</span><span style="font-weight:700;color:#F71D11">'+(u.churn_probability*100).toFixed(0)+'%</span></div>';
      h+='<div style="display:flex;gap:4px;flex-wrap:wrap">';
      (u.drivers||[]).slice(0,4).forEach(function(d){
        var c=d.direction==='increases_churn'?'#F71D11':'#188833';
        h+='<span style="font-size:8px;padding:2px 6px;border-radius:4px;background:'+c+'10;color:'+c+';border:1px solid '+c+'25">'+d.feature.replace(/_/g,' ')+' ('+d.shap_value.toFixed(2)+')</span>';
      });
      h+='</div></div>';
    });
    h+='</div></div>';
  }
  return h;
}

function runSim(){
  var el=document.getElementById('sim_results');
  el.innerHTML='<div class="cd mut" style="text-align:center;padding:30px">Running simulation...</div>';
  var body={cohort_key:document.getElementById('sim_cohort').value,playbook:document.getElementById('sim_playbook').value,budget:parseFloat(document.getElementById('sim_budget').value)||5000,target_count:parseInt(document.getElementById('sim_target').value)||500};
  fetch((window.API_BASE||'')+'/api/simulator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(r){
    var profit=r.net_profit||0;var profitColor=profit>0?'#188833':'#F71D11';
    var h='<div class="g g4" style="margin-bottom:0">';
    h+=mc('Target Users',fm(r.target_users),'#7C57CC','from '+r.cohort);
    h+=mc('Avg Churn Prob',pc(r.avg_churn_probability),'#DF7727','pre-intervention');
    h+=mc('Expected Retained',fm(r.expected_retained),'#188833','users saved');
    h+=mc('Projected Revenue','$'+fm(r.projected_revenue),'#188833','from retained');
    h+='</div><div class="g g3" style="margin-bottom:0">';
    h+=mc('Campaign Cost','$'+fm(r.projected_cost),'#DF7727',r.playbook.replace(/_/g,' '));
    h+=mc('Net Profit','$'+fm(profit),profitColor,'revenue - cost');
    h+=mc('ROI',r.roi+'x',r.roi>1?'#188833':'#F71D11','return on spend');
    h+='</div>';
    el.innerHTML=h;
  }).catch(function(e){el.innerHTML='<div class="cd" style="color:#F71D11">Simulation failed: '+e.message+'</div>';});
}

var selFunnel='onboarding';
function rendCohorts(){

  COH.forEach(function(c){
    var chP=c.churn_rate*100;var s=c.retention_strategy;

    if(c.corridor_split&&Object.keys(c.corridor_split).length){h+='<div style="margin-top:14px;display:flex;gap:8px">';Object.entries(c.corridor_split).forEach(function(cs){var cr2=cs[1].churn_rate*100;h+='<div style="background:#F2F2F7;border:1px solid #E5E5EA;border-radius:8px;padding:8px 14px;flex:1"><div style="font-size:12px;font-weight:600;letter-spacing:-1px;line-height:140%">'+cs[0]+'</div><div style="font-size:16px;font-weight:700;letter-spacing:-1px;line-height:130%">'+fm(cs[1].count)+'</div><div style="font-size:10px;color:'+(cr2>20?'#F71D11':'#188833')+'">'+cr2.toFixed(1)+'% churn</div></div>'});h+='</div>';}

var openCohort=null;
function toggleCohort(key){if(openCohort===key){document.getElementById('coh_'+key).style.display='none';openCohort=null}else{if(openCohort)document.getElementById('coh_'+openCohort).style.display='none';document.getElementById('coh_'+key).style.display='block';openCohort=key;document.getElementById('coh_'+key).scrollIntoView({behavior:'smooth',block:'start'})}}

function analyzeLaunch(tier,count){openPushModal({tier:tier,maxCount:Math.min(count,100),mode:'bulk'})}
function runRiskAnalysis(userId){var panel=document.getElementById('llm-risk-panel');var statusEl=document.getElementById('action-status');if(statusEl)statusEl.textContent='Running AI risk analysis...';if(panel){panel.style.display='block';panel.innerHTML='<div style="font-size:12px;font-weight:600;letter-spacing:-1px;line-height:140%;color:#A38CE5;margin-bottom:6px">AI RISK ANALYSIS</div><div class="mut" style="font-size:12px">Analyzing risk signals...</div>';}fetch((window.API_BASE||'')+'/api/ai/risk-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId})}).then(function(r){return r.json()}).then(function(d){if(statusEl)statusEl.innerHTML='<span style="color:#A38CE5">Analysis complete</span>';var a=d.analyses[userId];if(!a||a.error){if(panel)panel.innerHTML='<div style="color:#F71D11;font-size:12px">Analysis unavailable</div>';return;}var ph='<div style="font-size:12px;font-weight:600;letter-spacing:-1px;line-height:140%;color:#A38CE5;margin-bottom:8px">AI RISK ANALYSIS <span style="font-size:10px;color:#AEAEB2;font-weight:400">('+(a.source||'llm')+')</span></div>';ph+='<div style="display:flex;gap:6px;margin-bottom:8px"><span style="font-size:10px;padding:2px 8px;border-radius:6px;background:'+(a.urgency==='immediate'?'#F71D1115':'#DF772715')+';color:'+(a.urgency==='immediate'?'#F71D11':'#DF7727')+';font-weight:700">'+a.urgency+'</span><span style="font-size:10px;padding:2px 8px;border-radius:6px;background:#5523B215;color:#7C57CC;font-weight:700">confidence: '+(a.confidence*100).toFixed(0)+'%</span></div>';if(a.risk_signals){ph+='<div style="font-size:10px;font-weight:600;letter-spacing:-1px;line-height:130%;color:#AEAEB2;margin-bottom:4px">RISK SIGNALS</div>';a.risk_signals.forEach(function(s){var sc=s.severity==='critical'?'#F71D11':s.severity==='high'?'#DF7727':'#7C57CC';ph+='<div style="padding:4px 8px;margin-bottom:3px;border-radius:6px;background:'+sc+'08;border-left:3px solid '+sc+';font-size:12px"><b style="color:'+sc+'">'+s.signal+'</b> <span class="dim">\u2014 '+s.evidence+'</span></div>';});}if(a.intervention_plan){ph+='<div style="font-size:10px;font-weight:600;letter-spacing:-1px;line-height:130%;color:#AEAEB2;margin:8px 0 4px">INTERVENTION PLAN</div>';['primary','secondary','tertiary'].forEach(function(k){var p=a.intervention_plan[k];if(!p)return;var icon=k==='primary'?'1\uFE0F\u20E3':k==='secondary'?'2\uFE0F\u20E3':'3\uFE0F\u20E3';ph+='<div style="padding:6px 8px;margin-bottom:4px;border-radius:6px;background:#18883308;border:1px solid #18883315;font-size:12px"><span>'+icon+'</span> <b>'+p.action+'</b> via '+p.channel+' ('+p.timing+')<div class="dim" style="font-size:10px;margin-top:2px">'+p.message_template+'</div></div>';});}if(a.justification){ph+='<div style="font-size:10px;font-weight:600;letter-spacing:-1px;line-height:130%;color:#AEAEB2;margin:8px 0 4px">JUSTIFICATION</div><div style="font-size:12px;line-height:140%;letter-spacing:-1px;color:#0E0F11">'+a.justification+'</div>';}if(panel)panel.innerHTML=ph;}).catch(function(){if(statusEl)statusEl.innerHTML='<span style="color:#F71D11">Analysis failed</span>';if(panel)panel.innerHTML='<div style="color:#F71D11;font-size:12px">Failed to run analysis</div>';})}
function cld(){document.getElementById('dr').classList.remove('show');document.getElementById('ov').classList.remove('show')}

// AI Chat
function ask(p){var inp=document.getElementById('ci');var msg=p||(inp?inp.value.trim():'');if(!msg)return;if(inp)inp.value='';var sg=document.getElementById('sug');if(sg)sg.style.display='none';var ms=document.getElementById('cms');ms.innerHTML+='<div class="cm cu"><div>'+msg+'</div></div><div class="cm ca" id="ald" style="color:#AEAEB2">Thinking...</div>';ms.scrollTop=ms.scrollHeight;fetch((window.API_BASE||'')+'/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})}).then(function(r){return r.json()}).then(function(d){var el=document.getElementById('ald');if(el){el.id='';el.style.color='#0E0F11';el.textContent=d.response}ms.scrollTop=ms.scrollHeight}).catch(function(){var el=document.getElementById('ald');if(el){el.id='';el.textContent='Error.'}})}

// MAIN RENDERER

function rend(){
  var h='';
  if(T==='warroom')h=rendWarRoom();
  else if(T==='explorer')h=rendExplorer();
  else if(T==='experiments')h=rendExperiments();
  else if(T==='simulator')h=rendSimulator();
  else if(T==='cohorts')h=rendCohorts();
  else if(T==='command')h=rendCommand();
  document.getElementById('ct').innerHTML=h;
  if(T==='explorer'&&FLT.us){var e=document.getElementById('us');if(e){e.focus();e.setSelectionRange(FLT.us.length,FLT.us.length)}}
}

init();
